name: CI & Antigravity SDK Review

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  lint-and-test:
    name: Ruff Lint & FastAPI Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter across backend, ml, and scripts
        run: |
          ruff check backend/ ml/src/ scripts/

      - name: Run FastAPI & PostGIS Endpoint Unit Tests
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests/ -v

  antigravity-sdk-review:
    name: Antigravity SDK Automated Code Review
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Antigravity Python SDK
        run: |
          python -m pip install --upgrade pip
          pip install google-antigravity || echo "Using built-in static fallback until google-antigravity runner credentials are provided"

      - name: Execute Antigravity Read-Only Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
            HEAD_REF="HEAD"
          else
            # On direct push to main, audit latest commit diff against parent
            BASE_REF="HEAD~1"
            HEAD_REF="HEAD"
          fi

          if [ -n "$GEMINI_API_KEY" ]; then
            python scripts/agy_code_review.py --base "$BASE_REF" --head "$HEAD_REF"
          else
            python scripts/agy_code_review.py --base "$BASE_REF" --head "$HEAD_REF" --dry-run
          fi

      - name: Publish Review Report to Job Summary
        if: always() && hashFiles('pr_review_comment.md') != ''
        run: |
          cat pr_review_comment.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Review Report Artifact
        if: always() && hashFiles('pr_review_comment.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-review-report
          path: pr_review_comment.md
          retention-days: 7

      - name: Post Review Comment to Pull Request
        if: always() && github.event_name == 'pull_request' && hashFiles('pr_review_comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file pr_review_comment.md

      - name: Post Review Comment to Commit
        if: always() && github.event_name == 'push' && hashFiles('pr_review_comment.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@pr_review_comment.md || echo "Commit comment skipped or not permitted; review report is available in Job Summary."
