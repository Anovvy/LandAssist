<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">LandAssist</title>
  <desc id="desc">LandAssist logo: a geospatial map marker with segmented land parcels and a satellite orbit, paired with the LandAssist wordmark.</desc>
  <defs>
    <linearGradient id="tile" x1="34" y1="26" x2="222" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123B36"/>
      <stop offset="1" stop-color="#071F2B"/>
    </linearGradient>
    <linearGradient id="green" x1="70" y1="76" x2="186" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B6F36B"/>
      <stop offset="1" stop-color="#35C98B"/>
    </linearGradient>
    <linearGradient id="word" x1="316" y1="106" x2="815" y2="213" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123B36"/>
      <stop offset="1" stop-color="#087F69"/>
    </linearGradient>
  </defs>

  <!-- Brand mark -->
  <rect x="28" y="28" width="224" height="224" rx="58" fill="url(#tile)"/>
  <path d="M140 63C102.4 63 72 93.4 72 131c0 48.2 68 104 68 104s68-55.8 68-104c0-37.6-30.4-68-68-68Z" fill="url(#green)"/>
  <path d="M140 86c-24.9 0-45 20.1-45 45 0 27.8 31.1 59.3 45 72.2 13.9-12.9 45-44.4 45-72.2 0-24.9-20.1-45-45-45Z" fill="#0D3935"/>
  <!-- Segmented land parcels -->
  <path d="m105 116 33-19 2 38-35 18v-37Z" fill="#B6F36B"/>
  <path d="m145 96 31 19v38l-33-18 2-39Z" fill="#55D69A"/>
  <path d="m105 160 35-19 34 19-34 29-35-29Z" fill="#2FBF91"/>
  <path d="m140 135 34 18v7l-34 29v-54Z" fill="#E0F7A8" opacity=".92"/>
  <path d="m105 116 33-19m7-1 31 19m-71 45 35-19 34 19m-34-54v88" stroke="#0D3935" stroke-width="4" stroke-linejoin="round"/>
  <!-- Satellite orbit + satellite -->
  <path d="M61 102c19-35 57-56 99-54 19 1 37 7 52 17" stroke="#8BE4D0" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 10" opacity=".9"/>
  <g transform="translate(205 59) rotate(24)">
    <rect x="-10" y="-8" width="20" height="16" rx="4" fill="#F4F8E8"/>
    <path d="M-30-7h15v14h-15zM15-7h15v14H15z" fill="#70D8BD" stroke="#F4F8E8" stroke-width="2"/>
    <path d="M0 9v10" stroke="#F4F8E8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <circle cx="61" cy="102" r="5" fill="#B6F36B"/>

  <!-- Wordmark -->
  <text x="300" y="176" fill="url(#word)" font-family="Inter, Manrope, Arial, sans-serif" font-size="88" font-weight="750" letter-spacing="-4">LandAssist</text>
  <path d="M305 204h115" stroke="#43C995" stroke-width="7" stroke-linecap="round"/>
  <text x="305" y="244" fill="#52716D" font-family="Inter, Manrope, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4.5">AI-POWERED LAND MAPPING</text>
</svg>
